name: Patch Ollama docs once

on:
  push:
    paths:
      - .github/workflows/patch-ollama-docs-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch docs
        run: |
          python - <<'PY'
          from pathlib import Path

          patches = {
              Path('README.ja.md'): (
                  '#### llama.cpp / ローカルモデルの場合\n',
                  '''#### Ollama / ローカルモデルの場合\n\nOllamaはOpenAI互換APIを `http://127.0.0.1:11434/v1` で公開するため、INMでは `ollama-local` 設定をそのまま使えます。API keyは不要です。\n\nまず、ベンチマークしたいmodel tagでOllamaを起動・確認します。\n\n```bash\nollama run <model-tag>\n```\n\nLinux等でOllama serviceが動いていない場合は、別terminalで先に `ollama serve` を起動してください。\n\n`.env` には次を設定します。\n\n```dotenv\nOLLAMA_BASE_URL=http://127.0.0.1:11434/v1\nOLLAMA_MODEL_ID=<model-tag>\n```\n\nその後、5問だけ試します。\n\n```bash\npython -m runner.run --model ollama-local --limit 5\n```\n\n詳しくは [`docs/OLLAMA.md`](docs/OLLAMA.md) を参照してください。\n\n#### llama.cpp / ローカルモデルの場合\n'''
              ),
              Path('README.md'): (
                  '#### llama.cpp / local model\n',
                  '''#### Ollama / local model\n\nOllama exposes an OpenAI-compatible API at `http://127.0.0.1:11434/v1`, so INM can use it through the `ollama-local` config without a separate provider or API key.\n\nStart or verify the model using the same tag you want to benchmark:\n\n```bash\nollama run <model-tag>\n```\n\nIf the Ollama service is not already running, start `ollama serve` separately first. Then set:\n\n```dotenv\nOLLAMA_BASE_URL=http://127.0.0.1:11434/v1\nOLLAMA_MODEL_ID=<model-tag>\n```\n\nSmoke test:\n\n```bash\npython -m runner.run --model ollama-local --limit 5\n```\n\nSee [`docs/OLLAMA.md`](docs/OLLAMA.md) for details.\n\n#### llama.cpp / local model\n'''
              ),
              Path('docs/RUNNER.md'): (
                  '### Local llama.cpp\n',
                  '''### Local Ollama\n\nOllama provides an OpenAI-compatible endpoint at `http://127.0.0.1:11434/v1`, so INM uses the existing `openai_compatible` adapter. No Ollama API key is required.\n\nStart or verify the model with the exact model tag you intend to benchmark:\n\n```bash\nollama run <model-tag>\n```\n\nIf the Ollama service is not already running on your platform, start it separately with `ollama serve`. Configure INM in `.env`:\n\n```dotenv\nOLLAMA_BASE_URL=http://127.0.0.1:11434/v1\nOLLAMA_MODEL_ID=<model-tag>\n```\n\nThen run:\n\n```bash\npython -m runner.run --model ollama-local --limit 5\n```\n\n`OLLAMA_MODEL_ID` is intentionally explicit rather than auto-detected so benchmark results record the exact model tag used. See [`OLLAMA.md`](OLLAMA.md) for the complete Ollama setup.\n\n### Local llama.cpp\n'''
              ),
          }

          for path, (needle, replacement) in patches.items():
              text = path.read_text(encoding='utf-8')
              if needle not in text:
                  raise SystemExit(f'anchor not found in {path}: {needle!r}')
              path.write_text(text.replace(needle, replacement, 1), encoding='utf-8')
          PY
      - name: Commit docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.ja.md docs/RUNNER.md
          git commit -m "Document Ollama local evaluation"
          git push
