name: Fix historical run wording once

on:
  push:
    paths:
      - .github/workflows/fix-history-count-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix wording
        run: |
          python - <<'PY'
          from pathlib import Path
          changes = {
            'score.md': (
              'The last row is additionally invalidated as a representative model result because the old runner forced `temperature: 0`. The first two rows used the current 195-item dataset, but their system prompt predates the Reasoning-instruction v0.2 prompt.',
              'The last row is additionally invalidated as a representative model result because the old runner forced `temperature: 0`. The 12B, E2B, and E4B 195-item rows use the current working dataset, but all predate the standard `system_v0.2` prompt.'
            ),
            'score.ja.md': (
              '最後のrunは旧runnerが `temperature: 0` を強制していたため、モデルの代表性能としても無効化した結果です。最初の2runは現行195問datasetですが、Reasoning-instructionなv0.2より前のpromptを使っています。',
              '最後のrunは旧runnerが `temperature: 0` を強制していたため、モデルの代表性能としても無効化した結果です。12B・E2B・E4Bの195問runは現行working datasetを使っていますが、いずれも標準 `system_v0.2` より前のpromptです。'
            ),
          }
          for fn, (old, new) in changes.items():
              p=Path(fn); s=p.read_text(encoding='utf-8')
              if old not in s: raise SystemExit(f'missing marker: {fn}')
              p.write_text(s.replace(old,new,1), encoding='utf-8', newline='\n')
          PY
          git diff --check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add score.md score.ja.md
          git commit -m 'Fix historical run wording'
          git push
