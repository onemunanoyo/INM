name: Reasoning metadata migration once

on:
  push:
    paths:
      - .github/workflows/reasoning-metadata-once.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fix temporary migration marker
        run: sed -i 's/詳しくは \[`docs\/EVALUATION_PROTOCOL.md`\]/詳細は [`docs\/EVALUATION_PROTOCOL.md`]/' scripts/_reasoning_metadata_migration.py
      - name: Apply Reasoning terminology and metadata changes
        run: python scripts/_reasoning_metadata_migration.py
      - name: Validate Python syntax
        run: |
          python -m py_compile runner/config.py runner/run.py
      - name: Validate benchmark data
        run: python scripts/validate.py
      - name: Check diff
        run: git diff --check
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.ja.md prompts/system_v0.2.txt runner/config.py runner/run.py configs/models.example.yaml docs/RUNNER.md docs/EVALUATION_PROTOCOL.md docs/OLLAMA.md results/README.md .github/PULL_REQUEST_TEMPLATE/benchmark_result.md score.md score.ja.md data/leaderboard.json
          git commit -m 'Standardize Reasoning reporting across INM'
          git push
