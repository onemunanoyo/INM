name: Reasoning metadata cleanup once

on:
  push:
    paths:
      - .github/workflows/reasoning-metadata-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Clean up Reasoning terminology
        run: |
          python - <<'PY'
          from pathlib import Path

          def edit(path, replacements):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              for old, new in replacements:
                  s = s.replace(old, new)
              p.write_text(s, encoding='utf-8', newline='\n')

          edit('docs/EVALUATION_PROTOCOL.md', [
              ('\n---\n\n---\n\n## 8. Sampling Settings', '\n---\n\n## 8. Sampling Settings'),
          ])
          edit('score.md', [
              ('Materially different reasoning, sampling, quantization, or backend configurations', 'Materially different Reasoning, sampling, quantization, or backend configurations'),
          ])
          edit('score.ja.md', [
              ('必要に応じて利用可能なreasoning / thinkingを使い', '必要に応じて利用可能なReasoningを使い'),
              ('reasoning / sampling overrideがある場合は明示されている', 'Reasoning (`on` / `off`)、任意のReasoning detail、sampling overrideが明示されている'),
          ])
          edit('docs/RUNNER.md', [
              ('thinking/reasoning models are not cut off by a low output cap', 'Reasoning-capable models are not cut off by a low output cap'),
          ])
          edit('configs/models.example.yaml', [
              ('reasoning/thinking\n# models may also spend output budget on internal reasoning', 'Reasoning-capable\n# models may also spend output budget on internal reasoning'),
              ('thinking/reasoning models whose reasoning tokens may consume output', 'Reasoning-capable models whose reasoning tokens may consume output'),
          ])
          edit('README.md', [
              ('Recommended result reports should also include the exact model/version, quantization where relevant, inference backend, Local/Cloud classification, sampling settings, system-prompt hash, evaluation date, and item-isolation method.',
               'Recommended result reports should also include the exact model/version, quantization where relevant, inference backend, Local/Cloud classification, Reasoning (`on` / `off`), optional Reasoning detail, sampling settings, system-prompt hash, evaluation date, and item-isolation method.'),
          ])
          edit('README.ja.md', [
              ('結果公開時には、可能な限りモデル名・正確なバージョン、量子化、推論backend、Local / Cloud、sampling設定、system prompt hash、評価日、item isolation方法も記録してください。',
               '結果公開時には、可能な限りモデル名・正確なバージョン、量子化、推論backend、Local / Cloud、Reasoning (`on` / `off`)、任意のReasoning detail、sampling設定、system prompt hash、評価日、item isolation方法も記録してください。'),
          ])
          PY
      - name: Validate Python and benchmark data
        run: |
          python -m py_compile runner/config.py runner/run.py
          python scripts/validate.py
      - name: Check terminology leftovers
        run: |
          set -e
          if grep -R -n -E 'reasoning / thinking|reasoning/thinking|thinking/reasoning|reasoning / sampling|temperature / reasoning|LLAMA_CPP_API_KEY' README.md README.ja.md docs results score.md score.ja.md configs .github/PULL_REQUEST_TEMPLATE runner; then
            exit 1
          fi
      - name: Check diff
        run: git diff --check
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.ja.md docs/RUNNER.md docs/EVALUATION_PROTOCOL.md score.md score.ja.md configs/models.example.yaml
          git commit -m 'Clean up Reasoning terminology'
          git push
