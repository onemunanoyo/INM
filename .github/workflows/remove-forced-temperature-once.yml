name: Remove forced temperature once

on:
  push:
    paths:
      - .github/workflows/remove-forced-temperature-once.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Patch documentation
        run: |
          python - <<'PY'
          from pathlib import Path

          for name in ['README.md', 'README.ja.md', 'docs/RUNNER.md']:
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              text = text.replace('    temperature: 0\n', '')
              path.write_text(text, encoding='utf-8')

          # Explain the default policy in the detailed runner guide.
          path = Path('docs/RUNNER.md')
          text = path.read_text(encoding='utf-8')
          marker = ('By default, INM does not send `max_tokens` for OpenAI-compatible providers. '
                    'This avoids truncating thinking/reasoning models before they emit the final answer. '
                    'If you deliberately set an output cap, report it with the result because it can affect scores.\n')
          replacement = ('By default, INM does not send `temperature` or `max_tokens` for OpenAI-compatible '
                         'providers. The backend/model therefore keeps its own default sampling behavior, and '
                         'thinking/reasoning models are not cut off by a low output cap. If you deliberately '
                         'override sampling or output limits, report those settings with the result because they '
                         'can affect scores.\n')
          if marker in text:
              text = text.replace(marker, replacement, 1)
          elif replacement not in text:
              raise SystemExit('RUNNER sampling-policy marker not found')
          path.write_text(text, encoding='utf-8')

          path = Path('docs/OLLAMA.md')
          text = path.read_text(encoding='utf-8')
          heading = '### Output-token limits\n'
          sampling = ('### Sampling settings\n\nINM does **not** set `temperature` for `ollama-local` by default. '
                      'Ollama/model defaults are used unless you explicitly add a `temperature` value to '
                      '`configs/models.yaml`. This avoids silently replacing model-family-specific recommended '
                      'sampling behavior with a benchmark-wide `temperature: 0`. Any explicit sampling override '
                      'should be reported with the benchmark result.\n\n')
          if sampling.strip() not in text:
              if heading not in text:
                  raise SystemExit('OLLAMA heading not found')
              text = text.replace(heading, sampling + heading, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify default model configs do not force temperature
        run: |
          cp configs/models.example.yaml configs/models.yaml
          python - <<'PY'
          from pathlib import Path
          from runner.config import load_model_config

          path = Path('configs/models.yaml')
          for model_id in ['llama-local', 'ollama-local', 'openai', 'deepseek', 'gemini', 'claude']:
              cfg = load_model_config(path, model_id)
              assert 'temperature' not in cfg, (model_id, cfg)
          print('temperature defaults verified')
          PY
      - name: Verify public active examples do not force zero temperature
        run: |
          if grep -R --line-number --include='*.md' '^    temperature: 0$' README.md README.ja.md docs; then
            echo 'Found active temperature: 0 example' >&2
            exit 1
          fi
      - name: Commit documentation updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.ja.md docs/RUNNER.md docs/OLLAMA.md
          if git diff --cached --quiet; then
            echo 'No documentation changes.'
            exit 0
          fi
          git commit -m 'Use model default sampling unless explicitly overridden'
          git push
