name: Test Ollama runner config once

on:
  push:
    paths:
      - .github/workflows/test-ollama-config-once.yml

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verify Ollama env resolution
        env:
          OLLAMA_BASE_URL: http://127.0.0.1:11434/v1
          OLLAMA_MODEL_ID: test-ollama-model:latest
        run: |
          cp configs/models.example.yaml configs/models.yaml
          python - <<'PY'
          from pathlib import Path
          from runner.config import load_model_config

          cfg = load_model_config(Path('configs/models.yaml'), 'ollama-local')
          assert cfg['provider'] == 'openai_compatible', cfg
          assert cfg['base_url'] == 'http://127.0.0.1:11434/v1', cfg
          assert cfg['model'] == 'test-ollama-model:latest', cfg
          assert 'api_key_env' not in cfg, cfg
          print(cfg)
          PY
      - name: Verify runner dry-run
        env:
          OLLAMA_MODEL_ID: test-ollama-model:latest
        run: python -m runner.run --model ollama-local --dry-run --limit 1
