name: Reclassify Gemma 12B current once

on:
  push:
    paths:
      - .github/workflows/reclassify-gemma12b-current-once.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply reclassification
        run: python scripts/_reclassify_gemma12b.py
      - name: Render scoreboard
        run: python scripts/render_scoreboard.py
      - name: Validate
        run: |
          python -m json.tool data/leaderboard.json >/dev/null
          git diff --check
          grep -q '20260927T095811Z_ollama-local_68cc9586' score.md
          grep -q '20260927T095811Z_ollama-local_68cc9586' score.ja.md
          grep -q 'Gemma-4 12B it' docs/assets/scoreboard_overall.svg
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/leaderboard.json score.md score.ja.md docs/assets/scoreboard_overall.svg docs/assets/scoreboard_overall_ja.svg docs/assets/scoreboard_categories.svg docs/assets/scoreboard_categories_ja.svg
          git commit -m 'Treat Gemma 4 12B Reasoning-on run as current development'
          git push
