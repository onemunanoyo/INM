name: Test llama.cpp env overrides once

on:
  push:
    paths:
      - .github/workflows/test-llama-env-once.yml

permissions:
  contents: write

jobs:
  test-and-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verify env overrides
        env:
          LLAMA_CPP_BASE_URL: http://127.0.0.1:4321/v1
          LLAMA_CPP_MODEL_ID: test-local-alias
        run: |
          cp configs/models.example.yaml configs/models.yaml
          python - <<'PY'
          from pathlib import Path
          from runner.config import load_model_config
          cfg = load_model_config(Path('configs/models.yaml'), 'llama-local')
          assert cfg['base_url'] == 'http://127.0.0.1:4321/v1', cfg
          assert cfg['model'] == 'test-local-alias', cfg
          print('resolved base_url:', cfg['base_url'])
          print('resolved model:', cfg['model'])
          PY
      - name: Refresh llama.cpp documentation
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('README.ja.md'): (
                  '''INM Runnerとは別にllama.cpp serverを起動しておきます。\n\nデフォルト例は次のendpointを想定しています。\n\n```text\nhttp://127.0.0.1:8080/v1\n```\n\n`configs/models.yaml` の例:\n\n```yaml\nmodels:\n  llama-local:\n    provider: openai_compatible\n    model: YOUR_LLAMA_CPP_MODEL_ID\n    base_url: http://127.0.0.1:8080/v1\n    api_key_env: LLAMA_CPP_API_KEY\n    temperature: 0\n    max_tokens: 128\n```\n\n通常のローカルllama.cppでAPIキーが不要なら、`.env` の `LLAMA_CPP_API_KEY` は空のままで構いません。\n\n重要なのは、**serverが先に起動していること**と、`model:` がそのserverで受け付けられるIDになっていることです。''',
                  '''INM Runnerとは別にllama.cpp serverを起動しておきます。Runner自身はserverを起動せず、空いているportの自動探索も行いません。\n\n最も簡単なのは、llama.cpp側のAPI aliasを固定して起動する方法です。\n\n```bash\nllama-server \\\n  -m /path/to/model.gguf \\\n  --host 127.0.0.1 \\\n  --port 8080 \\\n  --alias inm-local\n```\n\n`configs/models.example.yaml` では `127.0.0.1:8080` と `inm-local` をfallback値にしています。通常は `models.yaml` を書き換えず、`.env` だけで接続先を変更できます。\n\n```dotenv\nLLAMA_CPP_BASE_URL=http://127.0.0.1:8080/v1\nLLAMA_CPP_MODEL_ID=inm-local\nLLAMA_CPP_API_KEY=\n```\n\nたとえばllama-serverをport 5000で起動した場合は、次の1行だけ変えます。\n\n```dotenv\nLLAMA_CPP_BASE_URL=http://127.0.0.1:5000/v1\n```\n\n`LLAMA_CPP_MODEL_ID` は `--alias` と同じ値にしてください。`--alias` を使わない場合は、llama.cppの `GET /v1/models` が返すmodel idを設定します。通常のローカルllama.cppでAPIキーが不要なら `LLAMA_CPP_API_KEY` は空のままで構いません。\n\n重要なのは、**serverを先に起動すること**、`.env` のendpointがそのserverを指していること、model idが一致していることです。'''
              ),
              Path('docs/RUNNER.md'): (
                  '''The INM runner does not launch llama.cpp.\n\nStart your llama.cpp server separately using your model and preferred server settings. The important requirement is that an OpenAI-compatible Chat Completions endpoint is available.\n\nThe example INM configuration expects:\n\n```text\nhttp://127.0.0.1:8080/v1\n```\n\nConfigure the entry:\n\n```yaml\nmodels:\n  llama-local:\n    provider: openai_compatible\n    model: YOUR_LLAMA_CPP_MODEL_ID\n    base_url: http://127.0.0.1:8080/v1\n    api_key_env: LLAMA_CPP_API_KEY\n    temperature: 0\n    max_tokens: 128\n```\n\nMost local llama.cpp servers do not require a real API key. The INM adapter uses a placeholder automatically when the referenced environment variable is empty.\n\nBefore running the benchmark, make sure the server is already running and that the model ID in `configs/models.yaml` matches what your server accepts.''',
                  '''The INM runner does not launch llama.cpp and does not scan for an available port. Start `llama-server` separately.\n\nA simple reproducible setup is:\n\n```bash\nllama-server \\\n  -m /path/to/model.gguf \\\n  --host 127.0.0.1 \\\n  --port 8080 \\\n  --alias inm-local\n```\n\nThe example model config keeps `http://127.0.0.1:8080/v1` and `inm-local` as fallback values, but both can be overridden from `.env` without editing YAML:\n\n```dotenv\nLLAMA_CPP_BASE_URL=http://127.0.0.1:8080/v1\nLLAMA_CPP_MODEL_ID=inm-local\nLLAMA_CPP_API_KEY=\n```\n\nFor example, when the server listens on port 5000:\n\n```dotenv\nLLAMA_CPP_BASE_URL=http://127.0.0.1:5000/v1\n```\n\nThe corresponding YAML uses environment-variable override names:\n\n```yaml\nmodels:\n  llama-local:\n    provider: openai_compatible\n    model: inm-local\n    model_env: LLAMA_CPP_MODEL_ID\n    base_url: http://127.0.0.1:8080/v1\n    base_url_env: LLAMA_CPP_BASE_URL\n    api_key_env: LLAMA_CPP_API_KEY\n    temperature: 0\n    max_tokens: 128\n```\n\nMost local llama.cpp servers do not require a real API key. The INM adapter uses a placeholder automatically when the referenced environment variable is empty. `LLAMA_CPP_MODEL_ID` should match the server API model id; using `--alias inm-local` is the easiest way to make that stable. If you do not use `--alias`, inspect `GET /v1/models` and put the returned id in `.env`.\n\nBefore running the benchmark, make sure the server is already running and that the resolved endpoint/model id match it.'''
              ),
          }

          for path, (old, new) in replacements.items():
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'expected documentation block not found in {path}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit documentation updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.ja.md docs/RUNNER.md
          if git diff --cached --quiet; then
            echo "No documentation changes."
            exit 0
          fi
          git commit -m "Document llama.cpp env endpoint configuration"
          git push
