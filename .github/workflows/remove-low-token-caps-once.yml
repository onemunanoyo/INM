name: Remove low token caps once

on:
  push:
    paths:
      - .github/workflows/remove-low-token-caps-once.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Patch documentation
        run: |
          python - <<'PY'
          from pathlib import Path

          # Public README examples: OpenAI-compatible providers should not
          # recommend a low output cap by default.
          for name in ['README.md', 'README.ja.md']:
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              text = text.replace(
                  '    temperature: 0\n    max_tokens: 128\n',
                  '    temperature: 0\n',
              )
              path.write_text(text, encoding='utf-8')

          path = Path('docs/RUNNER.md')
          text = path.read_text(encoding='utf-8')

          # Remove the 128-token cap from OpenAI-compatible examples.
          text = text.replace(
              '    provider: openai_compatible\n    model: YOUR_EXACT_MODEL_ID\n    base_url: https://api.openai.com/v1\n    api_key_env: OPENAI_API_KEY\n    temperature: 0\n    max_tokens: 128\n',
              '    provider: openai_compatible\n    model: YOUR_EXACT_MODEL_ID\n    base_url: https://api.openai.com/v1\n    api_key_env: OPENAI_API_KEY\n    temperature: 0\n',
          )

          # Anthropic Messages requires max_tokens, so keep it explicit but
          # avoid the old dangerously-low default.
          text = text.replace(
              '    provider: anthropic\n    model: YOUR_EXACT_CLAUDE_MODEL_ID\n    api_key_env: ANTHROPIC_API_KEY\n    temperature: 0\n    max_tokens: 128\n',
              '    provider: anthropic\n    model: YOUR_EXACT_CLAUDE_MODEL_ID\n    api_key_env: ANTHROPIC_API_KEY\n    temperature: 0\n    max_tokens: 8192\n',
          )

          marker = ('Provider-specific inference controls belong under `request_params` when supported. '
                    'Do not place web-search or tool configuration there; the official runner rejects '
                    'tool/retrieval-related request keys.\n')
          note = ('\nBy default, INM does not send `max_tokens` for OpenAI-compatible providers. '
                  'This avoids truncating thinking/reasoning models before they emit the final answer. '
                  'If you deliberately set an output cap, report it with the result because it can affect scores.\n')
          if note.strip() not in text:
              if marker not in text:
                  raise SystemExit('RUNNER marker not found')
              text = text.replace(marker, marker + note, 1)

          ollama_marker = ('`OLLAMA_MODEL_ID` is intentionally explicit rather than auto-detected so benchmark '
                           'results record the exact model tag used. See [`OLLAMA.md`](OLLAMA.md) for the complete '
                           'Ollama setup.\n')
          ollama_note = ('\n`ollama-local` intentionally has no `max_tokens` setting by default. If your local '
                         '`configs/models.yaml` was copied from an older revision, remove `max_tokens: 128` before '
                         'running a thinking model.\n')
          if ollama_note.strip() not in text and ollama_marker in text:
              text = text.replace(ollama_marker, ollama_marker + ollama_note, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify model configs do not impose low caps
        run: |
          cp configs/models.example.yaml configs/models.yaml
          python - <<'PY'
          from pathlib import Path
          from runner.config import load_model_config

          path = Path('configs/models.yaml')
          for model_id in ['llama-local', 'ollama-local', 'openai', 'deepseek', 'gemini']:
              cfg = load_model_config(path, model_id)
              assert 'max_tokens' not in cfg, (model_id, cfg)
          claude = load_model_config(path, 'claude')
          assert claude['max_tokens'] == 8192, claude
          print('token-cap configuration verified')
          PY
      - name: Verify no stale 128-token example remains
        run: |
          if grep -R --line-number --fixed-string 'max_tokens: 128' README.md README.ja.md docs configs; then
            echo 'Found stale max_tokens: 128 example' >&2
            exit 1
          fi
      - name: Commit documentation updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.ja.md docs/RUNNER.md
          if git diff --cached --quiet; then
            echo 'No documentation changes.'
            exit 0
          fi
          git commit -m 'Avoid low output caps for reasoning models'
          git push
