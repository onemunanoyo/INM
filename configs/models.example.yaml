# Copy to configs/models.yaml and edit model IDs/endpoints as needed.
# API keys and optional local endpoint overrides are read from environment
# variables (or a local .env file). Do not put secrets in this file.
#
# Optional provider-specific inference settings may be passed under
# request_params. This is where reasoning/sampling controls belong when a
# provider supports them. Retrieval/tool-related keys are blocked by the
# official runner.
#
# IMPORTANT: INM does not impose sampling temperature or max_tokens on
# OpenAI-compatible providers by default. Different model families have
# different recommended/default decoding settings, and reasoning/thinking
# models may also spend output budget on internal reasoning before producing
# the short benchmark answer. Add temperature/max_tokens only when you
# deliberately want to override the backend/model defaults, and report those
# overrides with the benchmark result.
#
# Some OpenAI-compatible models expect max_completion_tokens instead of
# max_tokens. If you explicitly set a cap for such a model, also set
# `token_limit_param: max_completion_tokens`.

models:
  llama-local:
    provider: openai_compatible
    model: inm-local
    model_env: LLAMA_CPP_MODEL_ID
    base_url: http://127.0.0.1:8080/v1
    base_url_env: LLAMA_CPP_BASE_URL
    # No temperature/max_tokens by default; use server/model defaults.
    # temperature: 0.6
    # max_tokens: 4096
    # request_params:
    #   top_p: 0.95

  ollama-local:
    provider: openai_compatible
    model: REPLACE_WITH_OLLAMA_MODEL_TAG
    model_env: OLLAMA_MODEL_ID
    base_url: http://127.0.0.1:11434/v1
    base_url_env: OLLAMA_BASE_URL
    # No temperature/max_tokens by default. This is especially important for
    # model families with their own recommended sampling settings and for
    # thinking/reasoning models whose reasoning tokens may consume output
    # budget before the final answer.
    # temperature: 0.6
    # max_tokens: 4096
    # Ollama's local API does not require an API key. The OpenAI Python SDK
    # still requires a non-empty client-side value, so the INM adapter supplies
    # an internal placeholder automatically when api_key_env is absent.

  openai:
    provider: openai_compatible
    model: YOUR_OPENAI_MODEL_ID
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    # Optional explicit overrides only when desired:
    # temperature: 0.7
    # max_tokens: 4096
    # token_limit_param: max_completion_tokens
    # request_params:
    #   reasoning_effort: medium

  deepseek:
    provider: openai_compatible
    model: deepseek-chat
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY
    # temperature: 1.0
    # max_tokens: 4096

  gemini:
    provider: openai_compatible
    model: YOUR_GEMINI_MODEL_ID
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    api_key_env: GEMINI_API_KEY
    # temperature: 1.0
    # max_tokens: 4096

  claude:
    provider: anthropic
    model: YOUR_CLAUDE_MODEL_ID
    api_key_env: ANTHROPIC_API_KEY
    # Temperature is intentionally omitted so the provider/model default is
    # used unless the evaluator explicitly chooses an override.
    # temperature: 1.0
    # Anthropic Messages requires an explicit max_tokens value. Keep this high
    # enough that reasoning does not consume the budget before the final answer.
    max_tokens: 8192
    # request_params may contain Anthropic inference controls supported by
    # the installed SDK/model, but may not contain tools or MCP settings.
